name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression suites and type checks
        run: npm run verify

  # `npm run verify` runs the regression suites and `tsc --noEmit`, but it never
  # ran `next build`. A change could therefore pass every required check and
  # still break the deployment - which is exactly what happened with the
  # TypeScript 7 bump: tests were green while `next build` failed because the Go
  # compiler no longer ships the JavaScript compiler API that Next.js needs.
  #
  # This job builds the web console only. Building every workspace would pull in
  # apps/studio, which requires Sanity credentials; this one stays credential-free.
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web console
        run: npm run build --workspace=@quicksilver/web

  go-sdk:
    name: go-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/sdk-go
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22.x'
          cache-dependency-path: packages/sdk-go/go.mod

      - name: Vet Go SDK
        run: go vet ./...

      - name: Test Go SDK
        run: go test -v -timeout=2m ./...

      - name: Build Go SDK
        run: go build ./...

  python-sdk:
    name: python-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test Python SDK and CLI
        run: python -m unittest discover -s packages/sdk-python/tests -v
