# Always-on hosting template (M5): Render blueprint for the single-tenant host.
# Deployment template for the single-tenant host. The existing Render service
# uses this topology; Genesis still needs entity and payment accounts before
# real payment webhooks are enabled.
#
# In Render: New → Blueprint → this repository, blueprint path deploy/render.yaml.
# Every secret below is `sync: false`: you enter it in the Render dashboard,
# it is never committed. The host config itself is a Render secret file.
services:
  - type: web
    name: quicksilver-host
    runtime: docker
    dockerfilePath: deploy/Dockerfile.host
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: false            # deploy on purpose, after review
    numInstances: 1              # one host per tenant at this version
    disk:
      name: quicksilver-data     # vault file, intent graphs, shadow logs, money ledger
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8787"
      - key: QUICKSILVER_HOST_CONFIG
        value: /etc/secrets/quicksilver.host.json   # add as a Render secret file
      - key: QUICKSILVER_DATA_DIR
        value: /data                         # intent, tasks, and governed memory
      - key: QUICKSILVER_GENESIS_DIR
        value: /data/genesis                 # Genesis ledger, experiments, and hosted-site history
      - key: QUICKSILVER_TENANT_ID
        value: brodi                 # must equal the tenantId in every QUICKSILVER_PRINCIPALS entry
      - key: DATABASE_URL
        fromDatabase:
          name: quicksilver-db
          property: connectionString
      - key: QUICKSILVER_VAULT_KEY
        sync: false
      - key: QUICKSILVER_PRINCIPALS
        sync: false
      # Approved actions (the first real email): docs/platform/render-live-email.md.
      # Add deploy/render/actions.render.json as the secret file actions.json.
      - key: QUICKSILVER_AUTHORIZATION_KEY   # at least 32 characters; without it every approval is refused (503)
        sync: false
      - key: QUICKSILVER_ACTIONS_CONFIG
        value: /etc/secrets/actions.json
      - key: QUICKSILVER_ACTIONS_DIR         # proposals live on the disk, or a restart loses them
        value: /data/actions
      - key: QUICKSILVER_EMAIL_API_KEY       # your Resend key; enter it in the Render dashboard only
        sync: false
      - key: SANITY_CONTEXT_MCP_URL
        sync: false
      - key: SANITY_CONTEXT_TOKEN
        sync: false
      - key: NEXT_PUBLIC_SANITY_PROJECT_ID
        sync: false
      # Editor token for the host's Sanity writes (threat model A-7).
      - key: SANITY_WRITE_TOKEN
        sync: false
      # Legacy combined token: fallback only. Remove once SANITY_WRITE_TOKEN is set.
      - key: SANITY_AUTH_TOKEN
        sync: false
      - key: AZURE_API_KEY
        sync: false
      - key: AZURE_RESOURCE_NAME
        sync: false

databases:
  - name: quicksilver-db
    plan: basic-256mb
    region: oregon
    databaseName: quicksilver
    user: quicksilver
    ipAllowList: []              # private network only
