<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1000px;height:420px;background:linear-gradient(135deg,#0f1419 0%,#14202c 100%);color:#e8edf2;font-family:Inter,"Segoe UI",system-ui,sans-serif;padding:48px 56px;position:relative;overflow:hidden}
.eyebrow{font-size:17px;letter-spacing:2.2px;text-transform:uppercase;color:#7cc0ff;font-weight:600}
h1{font-size:64px;line-height:1.04;margin-top:14px;letter-spacing:-1.2px}
h1 span{color:#7cc0ff}
.sub{font-size:23px;color:#b8c6d3;margin-top:20px;line-height:1.35;max-width:640px}
.chips{position:absolute;left:56px;bottom:40px;display:flex;gap:12px}
.chip{font-size:16px;padding:8px 14px;border-radius:999px;border:2px solid;font-weight:600}
.c1{border-color:#a98bff;color:#c8b6ff}.c2{border-color:#4aa3ff;color:#7cc0ff}.c3{border-color:#f0b24a;color:#ffd080}.c4{border-color:#3fbf8f;color:#6fe0b4}
.chain{position:absolute;right:48px;top:64px;width:200px}
.node{height:54px;border-radius:12px;border:2px solid;margin-bottom:18px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
.n1{border-color:#a98bff;background:#1e1a33;color:#c8b6ff}.n2{border-color:#4aa3ff;background:#112437;color:#7cc0ff}.n3{border-color:#f0b24a;background:#2a2113;color:#ffd080}.n4{border-color:#3fbf8f;background:#10261f;color:#6fe0b4}
</style>
<div class="eyebrow">Sanity Challenge · Path One</div>
<h1>Nuera <span>Quicksilver</span></h1>
<div class="sub">An agent that reads your company through Sanity Context, and can't approve its own work.</div>
<div class="chain"><div class="node n1">Agents propose</div><div class="node n2">Kernel authorizes</div><div class="node n3">A human approves</div><div class="node n4">Sanity records</div></div>
<div class="chips"><span class="chip c1">Sanity Context</span><span class="chip c2">No model in the kernel</span><span class="chip c4">Full audit trail</span></div>
